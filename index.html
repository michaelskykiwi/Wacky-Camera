<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>搞怪怪相机</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        /* 视频预览区域 */
        .camera-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 镜像翻转，让自拍更自然 */
            transform: scaleX(-1); 
        }
        /* 各种搞怪滤镜样式 */
        .filter-alien { filter: scaleX(-1) hue-rotate(90deg) saturate(3); } /* 外星人绿 */
        .filter-invert { filter: scaleX(-1) invert(1); } /* 妖魔鬼怪 */
        .filter-vintage { filter: scaleX(-1) sepia(1) contrast(1.5) saturate(2); } /* 极度复古 */
        .filter-blur { filter: scaleX(-1) contrast(3) blur(2px); } /* 迷幻眩晕 */

        /* 控制区域 */
        .controls {
            width: 100%;
            background: rgba(0,0,0,0.8);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-bottom: cubic-bezier(0.1, 0.8, 0.3, 1); /* 适配全面屏底部 */
        }
        /* 滤镜切换横轴 */
        .filter-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            width: 90%;
            padding: 5px;
        }
        .filter-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 15px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        .filter-btn.active {
            background: #007aff;
            border-color: #007aff;
        }
        /* 拍照大按钮 */
        .snap-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff;
            border: 5px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .snap-btn:active {
            background: #ccc;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <!-- autoPlay, playsInline, muted 是 iOS 网页内跑视频的必备参数 -->
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <!-- 滤镜选择器 -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="">正常</button>
            <button class="filter-btn" data-filter="filter-alien">👽 外星人</button>
            <button class="filter-btn" data-filter="filter-invert">👻 阴间魂</button>
            <button class="filter-btn" data-filter="filter-vintage">📺 古董机</button>
            <button class="filter-btn" data-filter="filter-blur">🥴 喝多了</button>
        </div>
        
        <!-- 拍照键 -->
        <button class="snap-btn" id="snap"></button>
    </div>

    <script>
        const video = document.getElementById('video');
        const snapBtn = document.getElementById('snap');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // 1. 开启手机摄像头（默认优先调用前置自拍镜头）
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" }, 
            audio: false 
        })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            alert("摄像头开启失败，请确保给了网页相机权限：" + err);
        });

        // 2. 切换滤镜效果
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 切换高亮样式
                document.querySelector('.filter-btn.active').classList.remove('active');
                btn.classList.add('active');
                
                // 给视频标签应用对应的 CSS 滤镜类名
                video.className = btn.getAttribute('data-filter');
            });
        });

        // 3. 拍照功能
        snapBtn.addEventListener('click', () => {
            // 物理震动反馈
            if (navigator.vibrate) navigator.vibrate(50);

            // 创建隐藏的画布用来截屏
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // 将当前的滤镜效果同步到画布上
            ctx.filter = getComputedStyle(video).filter;
            
            // 考虑镜像反转，将画面画入 canvas
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 转换成图片并直接弹出预览（手机上长按即可保存）
            const imgData = canvas.toDataURL('image/jpeg');
            const newWin = window.open();
            if(newWin) {
                newWin.document.write(`<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;"><img src="${imgData}" style="max-width:100%; max-height:100vh;"><p style="position:absolute;color:#fff;bottom:20px;">长按图片保存到相册</p></body>`);
            } else {
                alert("拍照成功！但弹窗被浏览器拦截了，请允许弹窗查看照片。");
            }
        });
    </script>
</body>
</html>
