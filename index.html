<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>搞怪相机 Wacky Camera</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #ff4757;
            --bg-color: #2f3542;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        /* 页面视图控制 */
        .view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .view.active {
            display: flex;
        }
        /* 主菜单样式 */
        #menu-view {
            background: linear-gradient(135deg, #747d8c, #2f3542);
        }
        .title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px #ff4757;
            animation: shake 0.5s infinite alternate;
        }
        @keyframes shake {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        /* 相机与预览区域 */
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 70vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video, canvas, img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 隐藏原生视频，全部用 Canvas 渲染滤镜 */
        video {
            opacity: 0;
            pointer-events: none;
        }
        /* 控制栏 */
        .controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }
        .btn-secondary {
            background-color: #747d8c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- 1. 主菜单视图 -->
    <div id="menu-view" class="view active">
        <h1 class="title">🤪 搞怪大变脸</h1>
        <button class="btn" onclick="startCamera()">打开魔镜</button>
    </div>

    <!-- 2. 相机拍摄视图 -->
    <div id="camera-view" class="view">
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>
        <div class="controls">
            <button class="btn btn-secondary" onclick="backToMenu()">返回菜单</button>
            <button class="btn" onclick="takePhoto()">咔嚓！</button>
        </div>
    </div>

    <!-- 3. 照片预览视图 -->
    <div id="preview-view" class="view">
        <div class="camera-container">
            <img id="photo-result" alt="无厘头照片">
        </div>
        <div class="controls">
            <!-- 修复核心：这里的按钮能安全清理状态并返回主菜单 -->
            <button class="btn btn-secondary" onclick="backToMenu()">重拍/返回</button>
            <button class="btn" onclick="savePhoto()">保存搞笑照</button>
        </div>
    </div>

    <script>
        const menuView = document.getElementById('menu-view');
        const cameraView = document.getElementById('camera-view');
        const previewView = document.getElementById('preview-view');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const photoResult = document.getElementById('photo-result');
        
        let stream = null;
        let animationFrameId = null;

        // 切换视图函数
        function switchView(activeView) {
            [menuView, cameraView, previewView].forEach(view => view.classList.remove('active'));
            activeView.classList.add('active');
        }

        // 启动相机并渲染搞怪特效
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                switchView(cameraView);
                
                // 等待视频元数据加载后对齐 Canvas 尺寸
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    renderWackyEffect();
                };
            } catch (err) {
                alert("无法开打摄像头，请检查权限设置：" + err.message);
            }
        }

        // 核心修复一：极度显眼的夸张搞怪滤镜渲染
        function renderWackyEffect() {
            if (video.paused || video.ended) return;

            // 1. 绘制原始视频帧
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. 注入极为显眼的搞怪颜色滤镜（反相 + 高饱和绿色调）
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                data[i] = 255 - data[i];       // 红通道反相
                data[i + 1] = data[i + 1] * 1.5; // 强行放大绿通道，让人脸变绿精
                if(data[i+1] > 255) data[i+1] = 255;
            }
            ctx.putImageData(imageData, 0, 0);

            // 3. 在最顶层强制绘制夸张的贴纸（用水印字符模拟，防止外部图片丢失）
            ctx.fillStyle = "#ff4757";
            ctx.font = `bold ${canvas.width * 0.15}px sans-serif`;
            ctx.textAlign = "center";
            // 在画面正中央强制盖上大猪鼻和搞笑墨镜符号
            ctx.fillText("🕶️", canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillText("🐷", canvas.width / 2, canvas.height / 2 + 40);

            animationFrameId = requestAnimationFrame(renderWackyEffect);
        }

        // 拍照操作
        function takePhoto() {
            // 停止动画帧刷新，锁定当前 Canvas 画面
            cancelAnimationFrame(animationFrameId);
            
            // 将含有滤镜和贴纸的 Canvas 直接导出为图片数据
            const dataUrl = canvas.toDataURL('image/jpeg');
            photoResult.src = dataUrl;
            
            switchView(previewView);
        }

        // 核心修复二：安全释放资源并完美退回主菜单
        function backToMenu() {
            // 1. 停止动画帧循环
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            // 2. 彻底释放并关闭摄像头硬件流，防止卡死
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            
            // 3. 清空 Canvas 画面
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 4. 切回主页面
            switchView(menuView);
        }

        // 保存照片
        function savePhoto() {
            const link = document.createElement('a');
            link.download = 'wacky-photo.jpg';
            link.href = photoResult.src;
            link.click();
        }
    </script>
</body>
</html>
